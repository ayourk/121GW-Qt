<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1320 860" width="1320" height="860" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4249"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1320" height="860" fill="#FAFBFB"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#1E2328">121GW signal chain as firmware 2.05 drives it</text>
  <text x="24" y="58" font-size="12.5" fill="#4A5258">Input jacks, board network and switches, HY3131 measurement chip, STM32L152ZD, outputs. Pin names are the MCU's; part numbers from the EEVblog schematic.</text>

  <!-- column headers -->
  <g font-size="13" font-weight="bold" fill="#4A5258">
    <text x="30" y="88">Jacks</text>
    <text x="170" y="88">Board network (switched by MCU pins)</text>
    <text x="552" y="88">HY3131 (U3)</text>
    <text x="870" y="88">STM32L152ZD</text>
    <text x="1110" y="88">Outputs</text>
  </g>

  <!-- jacks -->
  <g font-size="12" fill="#1E2328" text-anchor="middle">
    <circle cx="70" cy="140" r="24" fill="#272828"/><circle cx="70" cy="140" r="15" fill="#C0383A"/><circle cx="70" cy="140" r="6" fill="#202120"/>
    <text x="70" y="182" font-weight="bold">V Ω</text><text x="70" y="196" font-size="10.5">V, Ω, diode, cap,</text><text x="70" y="208" font-size="10.5">temp, Hz</text>
    <circle cx="70" cy="300" r="24" fill="#272828"/><circle cx="70" cy="300" r="15" fill="#C0383A"/><circle cx="70" cy="300" r="6" fill="#202120"/>
    <text x="70" y="342" font-weight="bold">mA µA</text>
    <circle cx="70" cy="410" r="24" fill="#272828"/><circle cx="70" cy="410" r="15" fill="#C0383A"/><circle cx="70" cy="410" r="6" fill="#202120"/>
    <text x="70" y="452" font-weight="bold">A 500mA</text>
    <circle cx="70" cy="520" r="24" fill="#272828"/><circle cx="70" cy="520" r="15" fill="#464D4D"/><circle cx="70" cy="520" r="6" fill="#202120"/>
    <text x="70" y="562" font-weight="bold">COM</text>
  </g>
  <text x="24" y="600" font-size="10.5" fill="#4A5258">Jack sense: PE10 (mA),</text>
  <text x="24" y="613" font-size="10.5" fill="#4A5258">PE11 (A)</text>
  <text x="24" y="633" font-size="10.5" fill="#4A5258">Dial switch T1 routes</text>
  <text x="24" y="646" font-size="10.5" fill="#4A5258">the jacks per position</text>
  <text x="24" y="659" font-size="10.5" fill="#4A5258">(contacts not traced)</text>

  <!-- board network boxes -->
  <g font-size="11" fill="#1E2328">
    <rect x="160" y="100" width="340" height="118" rx="6" fill="#E3EEF7" stroke="#5A6268"/>
    <text x="170" y="118" font-weight="bold" font-size="12">Protection and divider</text>
    <text x="170" y="135">PTCs + MOVs on the V Ω input</text>
    <text x="170" y="151">Compensated divider: 10 MΩ top (PA8),</text>
    <text x="170" y="166">taps 1.11 M / 101 k / 10 k / 1 k = ÷10 ... ÷10,000</text>
    <text x="170" y="182">(PA7, PA6, PA5, PA4); the same resistors are</text>
    <text x="170" y="197">the Ω references (1 k to 10 M, via RLU)</text>
    <text x="170" y="212">Input node "X" → 900 kΩ → PB0 (mV, temp, diode)</text>

    <rect x="160" y="236" width="340" height="128" rx="6" fill="#FBE9D6" stroke="#5A6268"/>
    <text x="170" y="254" font-weight="bold" font-size="12">Current path</text>
    <text x="170" y="271">Fuses, shunts ≈101 Ω (µA), 1.01 Ω (mA), 0.01 Ω (A)</text>
    <text x="170" y="287">U8 MAX4238 ×10 amplifier (on: SHDN_A PE12)</text>
    <text x="170" y="303">U11 74HC4053 picks ×10 or ×1 (A_CTL PE5)</text>
    <text x="170" y="319">→ A_IN → HY3131 PB1</text>
    <text x="170" y="337">uA, mA and A use the same HY3131 setup:</text>
    <text x="170" y="352">ranges are switched on the board</text>

    <rect x="160" y="382" width="340" height="140" rx="6" fill="#E7E1F2" stroke="#5A6268"/>
    <text x="170" y="400" font-weight="bold" font-size="12">AC path (analog RMS)</text>
    <text x="170" y="417">HY3131 OP1 output (net AC) → U15 HEF4052</text>
    <text x="170" y="433">(CTL_D PF4, CTL_E PF5) → U17 AD8436 true-RMS</text>
    <text x="170" y="449">converter → EXT_AC_OUT → HY3131 PB7 → AD1</text>
    <text x="170" y="467">1 kHz LPF: U15 channel 2 routes AC through an RC</text>
    <text x="170" y="483">ladder first (OP2 never enabled, so passive);</text>
    <text x="170" y="499">firmware corrects its droop</text>
    <text x="170" y="515">(ACFreq_LpfCompensate; missing in 2.04)</text>

    <rect x="160" y="540" width="340" height="126" rx="6" fill="#EEF0E6" stroke="#5A6268"/>
    <text x="170" y="558" font-weight="bold" font-size="12">Other board switches</text>
    <text x="170" y="575">CTL_B PC11: 1.5 nF on PB0 (Ohm only)</text>
    <text x="170" y="591">TEMP_CTL PH2: open-thermocouple pull-up (temp)</text>
    <text x="170" y="607">FRE_CTL PA12: RLD → 2.2 µF → CNT (Hz, pulse, duty)</text>
    <text x="170" y="623">LED_CK PE15 + ENB PF6: 15 V diode boost (U10)</text>
    <text x="170" y="639">CTL_A PD0, DCmV_CTL PD7, VA_CTL PA11:</text>
    <text x="170" y="655">no effect (parts not fitted or bypassed)</text>
  </g>

  <!-- jack arrows -->
  <g stroke="#3A4249" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M94,140 L158,140"/>
    <path d="M94,300 L158,300"/>
    <path d="M94,410 C125,410 125,340 158,330"/>
  </g>
  <text x="70" y="576" font-size="10.5" fill="#1E2328" text-anchor="middle">analog ground</text>

  <!-- HY3131 -->
  <rect x="540" y="100" width="290" height="566" rx="8" fill="#F2F4F5" stroke="#3A4249" stroke-width="1.6"/>
  <g font-size="11" fill="#1E2328">
    <rect x="552" y="110" width="266" height="96" rx="4" fill="#FFFFFF" stroke="#8A9298"/>
    <text x="560" y="127" font-weight="bold" font-size="12">Switch network</text>
    <text x="560" y="143">PA0-PA9, each with PS / DS / FS / SS</text>
    <text x="560" y="158">switches to the P, D, F and S buses</text>
    <text x="560" y="173">SMODE source: P bus to VDD / VSS / AGND,</text>
    <text x="560" y="188">OP3 drives a reference (Ω, diode, cap)</text>
    <text x="560" y="201">20-byte image R20-R33 per mode and range</text>

    <rect x="552" y="216" width="266" height="44" rx="4" fill="#FFFFFF" stroke="#8A9298"/>
    <text x="560" y="233" font-weight="bold" font-size="12">OP1</text>
    <text x="560" y="250">×10 (OP1N, 90k/10k) or follower</text>

    <rect x="552" y="270" width="266" height="78" rx="4" fill="#DCEFD9" stroke="#3E7A3A" stroke-width="1.4"/>
    <text x="560" y="287" font-weight="bold" font-size="12">AD1, 24-bit sigma-delta</text>
    <text x="560" y="303">every V, mV, A, Ω, diode, temperature</text>
    <text x="560" y="318">reading; AC via the AD8436 on PB7;</text>
    <text x="560" y="333">VA and burden time-share it (V, then I)</text>
    <text x="560" y="343" font-size="9.5" fill="#4A5258">DCV: 40 conversions/s</text>

    <rect x="552" y="358" width="266" height="44" rx="4" fill="#FFFFFF" stroke="#8A9298"/>
    <text x="560" y="375" font-weight="bold" font-size="12">AD2 + peak hold</text>
    <text x="560" y="392">1 ms PEAK only (ACV, ACmV)</text>

    <rect x="552" y="412" width="266" height="60" rx="4" fill="#FFFFFF" stroke="#8A9298"/>
    <text x="560" y="429" font-weight="bold" font-size="12">Counter + comparator</text>
    <text x="560" y="445">Hz, pulse width, duty (CNT input),</text>
    <text x="560" y="460">capacitance; AC frequency for correction</text>

    <rect x="552" y="482" width="266" height="44" rx="4" fill="#ECECEC" stroke="#A0A6AA" stroke-dasharray="4,3"/>
    <text x="560" y="499" font-weight="bold" font-size="12" fill="#6A7075">Digital RMS: read, discarded</text>
    <text x="560" y="516" fill="#6A7075">AD3 (power ADC): never used</text>

    <rect x="552" y="536" width="266" height="44" rx="4" fill="#FFFFFF" stroke="#8A9298"/>
    <text x="560" y="553" font-weight="bold" font-size="12">References and clock</text>
    <text x="560" y="570">ADR3412 1.2 V on PB6; X1 4.9152 MHz</text>

    <rect x="552" y="590" width="266" height="64" rx="4" fill="#FFF6D6" stroke="#8A9298"/>
    <text x="560" y="607" font-weight="bold" font-size="12">Serial port (bit-banged)</text>
    <text x="560" y="623">CK PF0, CS PF1, DI PF2, DO PF3</text>
    <text x="560" y="639">DO doubles as the interrupt line</text>
    <text x="560" y="651" font-size="9.5" fill="#4A5258">while CS is high (polled by the main loop)</text>
  </g>

  <!-- board -> HY3131 arrows -->
  <g stroke="#3A4249" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M500,158 L550,158"/>
    <path d="M500,300 L550,300"/>
    <path d="M550,240 L516,240 L516,398 L502,398"/>
    <path d="M502,449 L528,449 L528,318 L550,318"/>
    <path d="M502,606 L538,606 L538,452 L550,452"/>
  </g>
  <text x="508" y="232" font-size="9.5" fill="#4A5258">AC</text>
  <text x="504" y="442" font-size="9.5" fill="#4A5258">PB7</text>
  <text x="504" y="600" font-size="9.5" fill="#4A5258">CNT</text>

  <!-- STM32 -->
  <rect x="860" y="100" width="210" height="566" rx="8" fill="#E9EDF0" stroke="#3A4249" stroke-width="1.6"/>
  <g font-size="11" fill="#1E2328">
    <text x="870" y="122" font-weight="bold" font-size="12">Cortex-M3, 384 KB flash</text>
    <text x="870" y="140">MSI 4.194304 MHz system</text>
    <text x="870" y="155">clock (not 16 MHz)</text>
    <text x="870" y="175">TIM3 1 ms, TIM2 10 ms ticks</text>
    <text x="870" y="200" font-weight="bold">Firmware</text>
    <text x="870" y="216">bootloader 0x08000000</text>
    <text x="870" y="231">application 0x08006000</text>
    <text x="870" y="256" font-weight="bold">Data EEPROM 12 KB</text>
    <text x="870" y="272">settings 0x01-0x26</text>
    <text x="870" y="287">calibration records</text>
    <text x="870" y="302">current-zero trims 0x4D0</text>
    <text x="870" y="327" font-weight="bold">Inputs</text>
    <text x="870" y="343">keys PG8-PG15</text>
    <text x="870" y="358">dial PG0-PG7 (one-hot)</text>
    <text x="870" y="373">battery PA5 (ADC)</text>
    <text x="870" y="388">thermistor PA4: internal</text>
    <text x="870" y="403">temperature, cold junction</text>
    <text x="870" y="418">PF8 board-variant strap</text>
    <text x="870" y="443" font-weight="bold">Processing</text>
    <text x="870" y="459">offset and gain per</text>
    <text x="870" y="474">mode and range, filters,</text>
    <text x="870" y="489">autorange, AC frequency</text>
    <text x="870" y="504">correction, REL, MIN/MAX,</text>
    <text x="870" y="519">HOLD, logging</text>
    <text x="870" y="544" font-weight="bold">Power control</text>
    <text x="870" y="560">PD1 → U13 +4.0 V</text>
    <text x="870" y="575">PE9 → U1 3.6 V analog VDD</text>
    <text x="870" y="590">(HY3131 supply)</text>
    <text x="870" y="610">U2 3.3 V (MCU) is always on</text>
    <text x="870" y="625">while the dial is not OFF</text>
    <text x="870" y="645">auto power-off = STOP mode</text>
  </g>
  <g stroke="#3A4249" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M830,610 L858,610"/>
    <path d="M858,630 L832,630"/>
  </g>

  <!-- outputs -->
  <g font-size="11" fill="#1E2328">
    <rect x="1104" y="100" width="196" height="84" rx="6" fill="#C3C9B9" stroke="#49504F" stroke-width="2"/>
    <text x="1112" y="118" font-weight="bold" font-size="12">LCD glass</text>
    <text x="1112" y="134">on-chip LCD controller,</text>
    <text x="1112" y="149">4 COM, 1/3 bias, LSI clock</text>
    <text x="1112" y="164">backlight PE8 (long MODE)</text>

    <rect x="1104" y="198" width="196" height="114" rx="6" fill="#DCEBF7" stroke="#2A8CC8" stroke-width="1.6"/>
    <text x="1112" y="216" font-weight="bold" font-size="12">BLE112 Bluetooth</text>
    <text x="1112" y="232">USART2 PD5/PD6, 19200 8N1</text>
    <text x="1112" y="247">power PF15: off until a</text>
    <text x="1112" y="262">long 1ms PEAK press</text>
    <text x="1112" y="279">TX: 19-byte packet, ~2/s</text>
    <text x="1112" y="294">RX: F4 key, F8 clock frames</text>

    <rect x="1104" y="326" width="196" height="128" rx="6" fill="#FFFFFF" stroke="#5A6268"/>
    <text x="1112" y="344" font-weight="bold" font-size="12">microSD card</text>
    <text x="1112" y="360">SDIO 1-bit (only D0 wired)</text>
    <text x="1112" y="375">DMA2 channel 4</text>
    <text x="1112" y="390">runs on the 4 MHz HSE</text>
    <text x="1112" y="405">crystal (X2) during access</text>
    <text x="1112" y="420">no card detect; FatFs R0.08a</text>
    <text x="1112" y="435">YYMMDDNN.CSV logs, CAL.BIN;</text>
    <text x="1112" y="448">bootloader reads EEVBlog.bin</text>

    <rect x="1104" y="468" width="196" height="70" rx="6" fill="#FFFFFF" stroke="#5A6268"/>
    <text x="1112" y="486" font-weight="bold" font-size="12">NJU6350 clock chip</text>
    <text x="1112" y="502">3-wire bus, own 32.768 kHz</text>
    <text x="1112" y="517">crystal; date/time for logs</text>
    <text x="1112" y="531">and file times</text>

    <rect x="1104" y="552" width="196" height="56" rx="6" fill="#FFFFFF" stroke="#5A6268"/>
    <text x="1112" y="570" font-weight="bold" font-size="12">Buzzer PE7</text>
    <text x="1112" y="586">driven from TIM3 (1 ms)</text>
    <text x="1112" y="601">key beeps obey "b-OFF"</text>
  </g>
  <g stroke="#3A4249" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M1070,142 L1102,142"/>
    <path d="M1070,250 L1102,250"/>
    <path d="M1102,270 L1072,270"/>
    <path d="M1070,390 L1102,390"/>
    <path d="M1070,503 L1102,503"/>
    <path d="M1070,580 L1102,580"/>
  </g>

  <!-- power strip -->
  <rect x="24" y="710" width="1272" height="128" rx="8" fill="#F3F5F6" stroke="#8A9298"/>
  <g font-size="11.5" fill="#1E2328">
    <text x="36" y="732" font-weight="bold" font-size="13">Power and timing notes</text>
    <text x="36" y="752">Battery → dial contacts → B+: the OFF position cuts the battery in hardware. With the dial on a function, U2 (3.3 V, no enable) runs the MCU;</text>
    <text x="36" y="769">the firmware raises PD1 (+4.0 V, U13) before PE9 (3.6 V analog VDD, U1), and drops PE9 last at auto power-off.</text>
    <text x="36" y="789">The 4 MHz crystal X2 serves the SD card only; the LCD runs from LSI; the HY3131 has its own 4.9152 MHz crystal; the clock chip its own 32.768 kHz.</text>
    <text x="36" y="809">Configuration order at power-on: front-end pins to their idle state, then the boot screen sets the front end for mode 0 and writes the HY3131's first image.</text>
    <text x="36" y="829" fill="#4A5258">Arrows show signal direction; the routing through the rotary switch T1 is inferred, not traced.</text>
  </g>
</svg>
