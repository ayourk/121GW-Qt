<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1000" height="698" viewBox="0 0 1000 698" font-family="sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#56616B"/></marker></defs>
<rect x="0" y="0" width="1000" height="698" fill="#F4F6F8"/>
<text x="16" y="32" font-size="20" font-weight="bold" fill="#1B2026">121GW power-on key combinations</text>
<text x="16" y="54" font-size="13" fill="#56616B" text-anchor="start">Keys pressed while the meter is switched on. Two programs look at the keys: the SD bootloader, then the application&#x27;s boot screen.</text>
<rect x="16" y="70" width="968" height="140" rx="8" fill="#E8F2FA" stroke="#0F78B4"/>
<text x="30" y="94" font-size="15" fill="#1B2026" text-anchor="start" font-weight="bold">1. Bootloader (reads the keys once at power-on; it stays the same across firmware updates)</text>
<rect x="30" y="108" width="52" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="56.0" y="125" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">MEM</text>
<text x="88" y="125" font-size="16" fill="#1B2026" text-anchor="start" font-weight="bold">+</text>
<rect x="104" y="108" width="54" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="131.0" y="125" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">HOLD</text>
<text x="168" y="125" font-size="13" fill="#1B2026" text-anchor="start">held, all other keys released, then switch on</text>
<rect x="560" y="102" width="150" height="46" rx="4" fill="#6B7262" stroke="#49504F"/>
<text x="702" y="117" font-size="12" fill="#1B1D1B" text-anchor="end" font-weight="bold" font-family="monospace">-IAP-</text>
<text x="635.0" y="141" font-size="20" fill="#1B1D1B" text-anchor="middle" font-weight="bold" font-family="monospace">-IAP-</text>
<rect x="30" y="150" width="63" height="24" rx="12" fill="#E2BF55" stroke="#2A2F33"/>
<text x="61.5" y="167" font-size="12" fill="#221B1B" text-anchor="middle" font-weight="bold">SETUP</text>
<text x="103" y="167" font-size="13" fill="#1B2026" text-anchor="start">within about 8 s: update from EEVBlog.bin on the card (&quot;douun&quot;, then &quot; Good&quot; or &quot; FAIL&quot;, restart).</text>
<text x="30" y="196" font-size="12" fill="#56616B" text-anchor="start">No SETUP in time: the meter boots normally. Source: EEVblog&#x27;s bootloader reconstruction; used on a production meter.</text>
<rect x="16" y="226" width="968" height="456" rx="8" fill="#FFFFFF" stroke="#C5CCD2"/>
<text x="30" y="250" font-size="15" fill="#1B2026" text-anchor="start" font-weight="bold">2. Application boot screen (2 s, version shown as &quot;U-2.05&quot;); a key here acts at once, on press</text>
<rect x="30" y="271" width="62" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="61.0" y="288" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">RANGE</text>
<rect x="270" y="266" width="150" height="46" rx="4" fill="#6B7262" stroke="#49504F"/>
<text x="412" y="281" font-size="12" fill="#1B1D1B" text-anchor="end" font-weight="bold" font-family="monospace">-8.8.8.8.8</text>
<text x="345.0" y="305" font-size="20" fill="#1B1D1B" text-anchor="middle" font-weight="bold" font-family="monospace">-8.8.8.8.8</text>
<text x="440" y="286" font-size="13" fill="#1B2026" text-anchor="start">All segments and icons on (display test) for 2 s from the press,</text>
<text x="440" y="303" font-size="13" fill="#1B2026" text-anchor="start">then the normal start.</text>
<rect x="30" y="333" width="62" height="24" rx="12" fill="#D63D36" stroke="#2A2F33"/>
<text x="61.0" y="350" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">MODE</text>
<text x="97" y="350" font-size="14" fill="#56616B" text-anchor="start" font-weight="bold">&gt;</text>
<rect x="110" y="333" width="62" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="141.0" y="350" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">REL</text>
<rect x="270" y="328" width="150" height="46" rx="4" fill="#6B7262" stroke="#49504F"/>
<text x="412" y="343" font-size="12" fill="#1B1D1B" text-anchor="end" font-weight="bold" font-family="monospace">CAL</text>
<text x="345.0" y="367" font-size="20" fill="#1B1D1B" text-anchor="middle" font-weight="bold" font-family="monospace"> CAL1</text>
<text x="440" y="348" font-size="13" fill="#1B2026" text-anchor="start">MODE shows the calibration prompt for 2 s; REL then enters calibration</text>
<text x="440" y="365" font-size="13" fill="#1B2026" text-anchor="start">mode (sub &quot;CAL&quot; until power-off; all current-zero trims cleared).</text>
<rect x="30" y="395" width="62" height="24" rx="12" fill="#E2BF55" stroke="#2A2F33"/>
<text x="61.0" y="412" font-size="12" fill="#221B1B" text-anchor="middle" font-weight="bold">SETUP</text>
<text x="440" y="410" font-size="13" fill="#1B2026" text-anchor="start">Factory mode: SETUP starts on the year page; saving the year or</text>
<text x="440" y="427" font-size="13" fill="#1B2026" text-anchor="start">month-day also writes the date stamp (EEPROM 0x01).</text>
<rect x="30" y="457" width="62" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="61.0" y="474" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">MEM</text>
<text x="97" y="474" font-size="14" fill="#56616B" text-anchor="start" font-weight="bold">&gt;</text>
<rect x="110" y="457" width="62" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="141.0" y="474" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">REL</text>
<text x="177" y="474" font-size="14" fill="#56616B" text-anchor="start" font-weight="bold">&gt;</text>
<rect x="190" y="457" width="62" height="24" rx="12" fill="#D63D36" stroke="#2A2F33"/>
<text x="221.0" y="474" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">MODE</text>
<rect x="270" y="452" width="150" height="46" rx="4" fill="#6B7262" stroke="#49504F"/>
<text x="345.0" y="491" font-size="20" fill="#1B1D1B" text-anchor="middle" font-weight="bold" font-family="monospace">SD.SAv</text>
<text x="440" y="472" font-size="13" fill="#1B2026" text-anchor="start">SD.CAL prompt; REL picks save (&quot;SD.SAv&quot;); MODE writes CAL.BIN.</text>
<text x="440" y="489" font-size="13" fill="#1B2026" text-anchor="start">5 s per step. Result &quot;SAvEd&quot; or &quot;-Err-&quot; stays until power-off.</text>
<rect x="30" y="519" width="62" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="61.0" y="536" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">MEM</text>
<text x="97" y="536" font-size="14" fill="#56616B" text-anchor="start" font-weight="bold">&gt;</text>
<rect x="110" y="519" width="62" height="24" rx="12" fill="#4A5560" stroke="#2A2F33"/>
<text x="141.0" y="536" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">PEAK</text>
<text x="177" y="536" font-size="14" fill="#56616B" text-anchor="start" font-weight="bold">&gt;</text>
<rect x="190" y="519" width="62" height="24" rx="12" fill="#D63D36" stroke="#2A2F33"/>
<text x="221.0" y="536" font-size="12" fill="#F0F4F6" text-anchor="middle" font-weight="bold">MODE</text>
<rect x="270" y="514" width="150" height="46" rx="4" fill="#6B7262" stroke="#49504F"/>
<text x="345.0" y="553" font-size="20" fill="#1B1D1B" text-anchor="middle" font-weight="bold" font-family="monospace">SD.SET</text>
<text x="440" y="534" font-size="13" fill="#1B2026" text-anchor="start">As above; PEAK picks load (&quot;SD.SET&quot;): CAL.BIN back into EEPROM.</text>
<text x="440" y="551" font-size="13" fill="#1B2026" text-anchor="start">A good load also shows &quot;SAvEd&quot;.</text>
<text x="30" y="586" font-size="13" fill="#1B2026" text-anchor="start" font-weight="bold">Traps (emulated, stock 2.05):</text>
<text x="30" y="606" font-size="12" fill="#56616B" text-anchor="start">- A key still held 0.5 s after power-on also fires its long press. Holding MEM that long starts logging under the SD.CAL prompt and</text>
<text x="30" y="624" font-size="12" fill="#56616B" text-anchor="start">  leaves a one-row CSV (function LowZ) on the card; holding MODE toggles the backlight; holding SETUP opens the year for editing.</text>
<text x="30" y="642" font-size="12" fill="#56616B" text-anchor="start">- The calibration prompt reads &quot;CAL 1&quot; on the glass: main &quot; CAL1&quot; (dot after A), sub &quot;CAL&quot;. No REL within 2 s: normal start.</text>
<text x="30" y="660" font-size="12" fill="#56616B" text-anchor="start">- After an SD save or load the screen keeps &quot;SAvEd&quot;/&quot;-Err-&quot;; keys still act on the hidden meter state. Switch off and on to continue.</text>
</svg>
